aid: tidal-vision
name: Tidal Vision
description: 'Tidal Vision Products, Inc. is a Bellingham, Washington biotechnology and
  specialty-chemicals manufacturer, and the only commercial-scale US producer of chitosan
  — a non-toxic, non-hazmat, biodegradable industrial biopolymer upcycled from crab and
  shrimp shell waste. Its zero-waste Chitofining process extracts, modifies and formulates
  chitosan chemistries that displace PFAS, halogenated chemicals, toxic antimicrobials and
  persistent plastics across three business lines: Tidal Clear water and wastewater
  treatment, Tidal Grow AgriScience crop and soil inputs, and Tidal-Tec Biomaterial Science
  performance materials. The company closed an oversubscribed $140M+ Series B in 2025 and
  acquired Clear Water Services. It is a materials-science manufacturer and publishes no
  public developer program, API, or machine-readable API contract.'
